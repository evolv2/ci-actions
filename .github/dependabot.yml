version: 2

# Every entry has a 7-day cooldown: a version update waits until the release
# is 7 days old, so a hijacked fresh release is caught before a PR proposes it
# (supply-chain policy, T-20261119-06). Security updates ignore the cooldown.
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/buildkit"
      - "/scan-sign"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
