name: repo-scan

# repo-scan on this repository itself, from the working tree of the PR: proves
# the action on every change and keeps this public repository free of
# committed secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-scan:
    # hosted: public repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./repo-scan
        with:
          enforce: "true"
