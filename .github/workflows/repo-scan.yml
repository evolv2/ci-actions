name: repo-scan

# repo-scan on this repository itself, from the working tree of the PR: proves
# the action on every change and keeps this public repository free of
# committed secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-scan:
    # hosted: public repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./repo-scan
        with:
          enforce: "true"
