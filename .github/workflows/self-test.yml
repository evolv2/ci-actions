name: self-test

# Proves scan-sign end to end on a real runner against the real registry:
# a tiny image is pushed, scanned, signed with a key that exists only in this
# run, verified with its public key, and an unsigned image is shown to fail
# verification. The test repository is removed afterwards.
#
# This repository is public, so it holds no Azure identity: it logs in with an
# ACR token that can only touch apps/ci-actions-selftest (scope map
# ci-selftest: content read/write/delete, metadata read). That is the same
# route the app repos in evolv2-apps take, so this test covers what they run:
# docker login + digest-source registry.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    env:
      REGISTRY: evaplatform.azurecr.io
      REPOSITORY: apps/ci-actions-selftest
      IMAGE: evaplatform.azurecr.io/apps/ci-actions-selftest
      TAG: run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry with the self-test token
        env:
          ACR_USERNAME: ${{ secrets.ACR_SELFTEST_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_SELFTEST_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::ACR_SELFTEST_USERNAME / ACR_SELFTEST_PASSWORD are not set for this repository."
            exit 1
          fi
          printf '%s' "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin

      - name: Build and push a tiny image
        run: |
          printf 'FROM alpine:3.20\nCMD ["true"]\n' > Dockerfile.selftest
          docker build -f Dockerfile.selftest -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

      - name: Throwaway key for this run
        id: key
        run: |
          bin="$RUNNER_TEMP/k"; mkdir -p "$bin"; cd "$bin"
          curl -fsSLO https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          curl -fsSLO https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign_checksums.txt
          grep " cosign-linux-amd64$" cosign_checksums.txt | sha256sum -c -
          chmod +x cosign-linux-amd64
          export COSIGN_PASSWORD="$(openssl rand -hex 24)"
          ./cosign-linux-amd64 generate-key-pair --output-key-prefix selftest >/dev/null
          echo "::add-mask::$COSIGN_PASSWORD"
          echo "password=$COSIGN_PASSWORD" >> "$GITHUB_OUTPUT"
          {
            echo 'key<<EOF'; cat selftest.key; echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          cp selftest.pub "$RUNNER_TEMP/selftest.pub"

      # digest-source registry: no az here. That both sources resolve the same
      # digest was proven while this repository still had az (run on the
      # branch of #1); the platform repos keep exercising the acr source in
      # their own builds.
      - id: scansign
        uses: ./scan-sign
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.TAG }}
          digest-source: registry
          cosign-key: ${{ steps.key.outputs.key }}
          cosign-password: ${{ steps.key.outputs.password }}

      - name: Verify the signature, and that an unsigned image fails
        env:
          REF: ${{ steps.scansign.outputs.ref }}
        run: |
          set -euo pipefail
          cosign verify --key "$RUNNER_TEMP/selftest.pub" --insecure-ignore-tlog=true "$REF" > /dev/null
          echo "::notice::signed image verifies"
          # The signature must be a TAG (sha256-<digest>.sig): acr-retention in
          # eva-server purges untagged manifests after 2 days, which would
          # silently delete signatures stored as untagged OCI referrers.
          sigtag="sha256-${REF##*sha256:}.sig"
          if ! docker buildx imagetools inspect "$IMAGE:$sigtag" > /dev/null 2>&1; then
            echo "::error::signature is not stored as tag $sigtag"
            exit 1
          fi
          echo "::notice::signature stored as tag $sigtag"
          docker build -f Dockerfile.selftest -t "$IMAGE:unsigned-$TAG" --label unsigned=1 .
          docker push "$IMAGE:unsigned-$TAG"
          if cosign verify --key "$RUNNER_TEMP/selftest.pub" --insecure-ignore-tlog=true "$IMAGE:unsigned-$TAG" > /dev/null 2>&1; then
            echo "::error::an unsigned image verified"; exit 1
          fi
          echo "::notice::unsigned image is refused"

      # The token must NOT reach beyond its own repository: a push to a
      # platform repository has to be denied. This is the property the per-app
      # tokens in evolv2-apps rely on.
      - name: The token cannot push outside its own repository
        run: |
          docker tag "$IMAGE:$TAG" "$REGISTRY/eva-server:selftest-must-fail-$TAG"
          if docker push "$REGISTRY/eva-server:selftest-must-fail-$TAG" > /dev/null 2>&1; then
            echo "::error::the self-test token pushed to eva-server"; exit 1
          fi
          echo "::notice::push outside the token's repository is denied"

      - name: Remove the test repository
        if: always()
        env:
          ACR_USERNAME: ${{ secrets.ACR_SELFTEST_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_SELFTEST_PASSWORD }}
        run: |
          az acr repository delete -n evaplatform --repository "$REPOSITORY" \
            -u "$ACR_USERNAME" -p "$ACR_PASSWORD" --yes > /dev/null 2>&1 \
            && echo "test repository removed" || echo "::warning::could not remove $REPOSITORY"
