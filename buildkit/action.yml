name: Set up a buildx builder (shared BuildKit, dind fallback)
description: >-
  Create the buildx builder an image build uses. On the eva-ci build runners
  (`leafcloud-build-*`) it connects to the shared BuildKit daemon in the
  `buildkit` namespace, whose cache persists between builds: layers, and
  `--mount=type=cache` directories such as Next.js's `.next/cache`. Anywhere
  else, or when that daemon is not ready within `wait-seconds`, it creates a
  throwaway docker-container builder as the workflows did before. The build
  always gets a builder; the shared one only makes it faster.

  Use the `remote` output to drop `--cache-to type=registry`: the daemon
  keeps its own cache, and exporting it to the registry costs 1-3 minutes a
  build. Keep `--cache-from`, so a cold daemon (new volume, after garbage
  collection) still starts from the registry cache.

inputs:
  name:
    description: Prefix of the builder name; the run id and attempt are appended.
    required: true
  fallback-image:
    description: BuildKit image for the fallback docker-container builder.
    required: true
  endpoint:
    description: The shared daemon.
    default: tcp://buildkitd.buildkit.svc.cluster.local:1234
  runner-prefix:
    description: >-
      Only runners whose name starts with this try the shared daemon. Only the
      build runners may reach it (NetworkPolicy); on any other runner trying
      would just wait out `wait-seconds`.
    default: leafcloud-build-
  wait-seconds:
    description: >-
      How long to wait for the daemon. It is scaled from 0 when the build
      runner pod appears, which can mean a new node (~4 minutes from zero); by
      the time a job reaches its build step it is usually up.
    default: "300"

outputs:
  builder:
    description: Name of the builder, also made the default (`docker buildx use`).
    value: ${{ steps.setup.outputs.builder }}
  remote:
    description: '"true" when the build uses the shared daemon, "false" for the fallback.'
    value: ${{ steps.setup.outputs.remote }}

runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        FALLBACK_IMAGE: ${{ inputs.fallback-image }}
        ENDPOINT: ${{ inputs.endpoint }}
        RUNNER_PREFIX: ${{ inputs.runner-prefix }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
      run: |
        set -uo pipefail
        builder="${NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        remote=false

        if [[ "${RUNNER_NAME:-}" == "${RUNNER_PREFIX}"* ]]; then
          docker buildx create --name "$builder" --driver remote "$ENDPOINT" >/dev/null
          start=$SECONDS
          until timeout 20 docker buildx inspect "$builder" --bootstrap >/dev/null 2>&1; do
            if (( SECONDS - start >= WAIT_SECONDS )); then
              break
            fi
            sleep 5
          done
          if timeout 20 docker buildx inspect "$builder" --bootstrap >/dev/null 2>&1; then
            remote=true
            echo "Shared BuildKit ready after $((SECONDS - start))s ($ENDPOINT)"
          else
            echo "::warning::Shared BuildKit not ready after ${WAIT_SECONDS}s; building on a local dind builder (slower, no persistent cache)"
            docker buildx rm "$builder" >/dev/null 2>&1 || true
          fi
        fi

        if [[ "$remote" == false ]]; then
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt "image=${FALLBACK_IMAGE}" --bootstrap >/dev/null
        fi
        docker buildx use "$builder"

        echo "builder=$builder" >> "$GITHUB_OUTPUT"
        echo "remote=$remote" >> "$GITHUB_OUTPUT"
        if [[ "$remote" == true ]]; then
          echo "Builder: shared BuildKit (persistent cache)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Builder: local dind (no persistent cache)" >> "$GITHUB_STEP_SUMMARY"
        fi
