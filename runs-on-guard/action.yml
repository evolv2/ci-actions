name: Refuse jobs on GitHub-hosted runners
description: >-
  Fails the job when a workflow in this repository runs on a GitHub-hosted
  runner without a stated reason. Every evolv2 job runs on our own runners
  (eva-ci, labels leafcloud / leafcloud-build / leafcloud-tests /
  leafcloud-publish), chosen through a repository variable so a repo can
  switch without a PR: `${{ vars.CI_RUNNER || 'leafcloud' }}`, and for jobs
  that hold a deploy or publish credential `vars.DEPLOY_RUNNER`.

  The rules (runs-on-guard/check.sh):

  - a hosted label (ubuntu-*, windows-*, macos-*), also as a fallback or a
    matrix entry, needs `# hosted: <reason>` on that line or the line above;
  - in a public repository it is the other way round: a job on an own runner
    is refused (anyone can open a PR there);
  - `pull_request_target` with a checkout of the PR head on an own runner is
    refused.

  Why (T-20261127-12, 27-11-2026): the org's Actions budget ran out, and every
  job still on GitHub-hosted stopped (admin deploys since 25-11, eva-sdk CI).
  Michael: everything on our own runners, including the security scans.

inputs:
  path:
    description: Directory with the workflow files.
    default: .github/workflows

runs:
  using: composite
  steps:
    - name: Check runs-on labels
      shell: bash
      env:
        WORKFLOW_DIR: ${{ inputs.path }}
        PUBLIC_REPO: ${{ github.event.repository.private == false }}
      run: bash "$GITHUB_ACTION_PATH/check.sh" "$WORKFLOW_DIR" "$PUBLIC_REPO"
