name: Scan and sign a pushed image
description: >-
  Resolve the digest of an image pushed to ACR, scan it with Trivy (fail on a
  CRITICAL vulnerability that has a fix), and sign it by digest with cosign.
  Run it right after the push, with docker logged in to the registry: via
  `az acr login` in the evolv2 platform repos (digest-source acr), or via
  `docker login` with a repository-scoped ACR token in evolv2-apps
  (digest-source registry). Trivy and cosign read docker's credentials.

inputs:
  image:
    description: Repository in the registry, e.g. evaplatform.azurecr.io/eva-server
    required: true
  tag:
    description: The pinned tag that was just pushed (not dev/latest)
    required: true
  registry:
    description: ACR name, used to resolve the digest (digest-source acr)
    default: evaplatform
  digest-source:
    description: >-
      How to resolve the pushed digest. "acr" (default): `az acr repository
      show`, needs `az login`, as the evolv2 platform repos do. "registry":
      ask the registry itself with `docker buildx imagetools inspect`, needs
      only `docker login` -- for evolv2-apps, whose builds log in with a
      repository-scoped ACR token and have no Azure identity. Both return the
      manifest digest the registry stores for the tag.
    default: acr
  cosign-key:
    description: cosign private key (secrets.COSIGN_PRIVATE_KEY). Empty = scan only.
    default: ""
  cosign-password:
    description: password of the cosign key (secrets.COSIGN_PASSWORD)
    default: ""
  fail-on:
    description: Trivy severities that fail the build when a fix exists
    default: CRITICAL
  enforce:
    description: >-
      "true" fails the build on fail-on findings; "false" only reports them
      (job summary + warning). Use "false" while a repo still has findings
      from before the gate existed, then switch to "true".
    default: "true"

outputs:
  digest:
    description: sha256 digest of the image
    value: ${{ steps.digest.outputs.digest }}
  ref:
    description: image@digest
    value: ${{ steps.digest.outputs.ref }}

runs:
  using: composite
  steps:
    # The digest ACR indexes, not the one buildx prints: the two differ for
    # buildx pushes, and pinning on the buildx one gave ImagePullBackOff
    # (eva-server build-backup-image.yml). Sign and scan exactly what runs.
    - id: digest
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        REGISTRY: ${{ inputs.registry }}
        DIGEST_SOURCE: ${{ inputs.digest-source }}
      run: |
        set -euo pipefail
        repo="${IMAGE#*/}"
        case "$DIGEST_SOURCE" in
          acr)
            digest=$(az acr repository show -n "$REGISTRY" --image "${repo}:${TAG}" --query digest -o tsv) ;;
          registry)
            # The descriptor the registry returns for the tag: for a buildx
            # push with attestations that is the index digest, exactly what
            # `az acr repository show` reports and what a pod pulls.
            digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest') ;;
          *)
            echo "::error::digest-source must be 'acr' or 'registry' (got '${DIGEST_SOURCE}')"
            exit 1 ;;
        esac
        if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::No digest for ${IMAGE}:${TAG} (got '${digest}')"
          exit 1
        fi
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
        echo "::notice::${IMAGE}:${TAG} = ${digest}"

    # Official releases, verified against sha256 sums pinned HERE (taken from
    # the GitHub release API's asset digests), not against a checksums file
    # downloaded next to the binary. The verified downloads are kept in the
    # Actions cache, keyed on version and sum, so a build does not depend on
    # GitHub's release CDN being up: on 08-11-2026 it answered 504 for hours
    # and every eva-server dev build failed here. The sum is checked on every
    # run, cache hit or not, so the cache is a copy and never a trust source.
    # Bumping a tool = new version + its sum in `pins`; the key follows.
    - id: pins
      shell: bash
      run: |
        set -euo pipefail
        TRIVY=0.75.0
        TRIVY_SHA256=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        COSIGN=3.1.3
        COSIGN_SHA256=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        {
          echo "trivy=${TRIVY}"; echo "trivy-sha256=${TRIVY_SHA256}"
          echo "cosign=${COSIGN}"; echo "cosign-sha256=${COSIGN_SHA256}"
          echo "dir=${RUNNER_TEMP}/scan-sign-dl"
          echo "key=scan-sign-tools-${RUNNER_OS}-${RUNNER_ARCH}-trivy${TRIVY}-${TRIVY_SHA256:0:12}-cosign${COSIGN}-${COSIGN_SHA256:0:12}"
        } >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.pins.outputs.dir }}
        key: ${{ steps.pins.outputs.key }}

    - id: tools
      shell: bash
      env:
        TRIVY: ${{ steps.pins.outputs.trivy }}
        TRIVY_SHA256: ${{ steps.pins.outputs.trivy-sha256 }}
        COSIGN: ${{ steps.pins.outputs.cosign }}
        COSIGN_SHA256: ${{ steps.pins.outputs.cosign-sha256 }}
        DL: ${{ steps.pins.outputs.dir }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        mkdir -p "$DL"; cd "$DL"
        trivy_tgz="trivy_${TRIVY}_Linux-64bit.tar.gz"
        fetch() {
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 -o "$2" "$1"
        }
        verify() {
          echo "${TRIVY_SHA256}  ${trivy_tgz}" | sha256sum -c - &&
          echo "${COSIGN_SHA256}  cosign-linux-amd64" | sha256sum -c -
        }
        downloaded=false
        if [ "$CACHE_HIT" = "true" ] && verify; then
          echo "::notice::trivy ${TRIVY} and cosign ${COSIGN} from the Actions cache (sha256 verified)"
        else
          [ "$CACHE_HIT" = "true" ] && echo "::warning::cached tools failed the sha256 check; downloading again"
          rm -f "$trivy_tgz" cosign-linux-amd64
          fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY}/${trivy_tgz}" "$trivy_tgz"
          fetch "https://github.com/sigstore/cosign/releases/download/v${COSIGN}/cosign-linux-amd64" cosign-linux-amd64
          verify
          downloaded=true
        fi
        echo "downloaded=${downloaded}" >> "$GITHUB_OUTPUT"
        bin="${RUNNER_TEMP}/scan-sign-bin"; mkdir -p "$bin"
        tar -xzf "$trivy_tgz" -C "$bin" trivy
        install -m 0755 cosign-linux-amd64 "$bin/cosign"
        echo "$bin" >> "$GITHUB_PATH"

    # Saved right away rather than in a post step, so a scan that fails later
    # (a finding) still leaves the verified tools for the next run.
    - if: steps.tools.outputs.downloaded == 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: ${{ steps.pins.outputs.dir }}
        key: ${{ steps.pins.outputs.key }}

    - id: scan
      shell: bash
      env:
        REF: ${{ steps.digest.outputs.ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        ENFORCE: ${{ inputs.enforce }}
      run: |
        set -euo pipefail
        # One scan, kept as JSON: the summary and the gate both read it. Large
        # images (torch/CUDA layers of several GB) need more than trivy's default
        # 5 minutes; a scan that errors out must not read as "has findings".
        # Seen 15-10-2026 on eva-decision-model: trivy hit its timeout on one
        # layer, the old `if ! trivy ... --exit-code 1` took that for a finding,
        # and the run warned about CRITICAL vulnerabilities the image did not have.
        report="${RUNNER_TEMP}/trivy.json"
        rc=0
        # Read the pushed image from the registry (by digest), not from the local
        # Docker: with the local image trivy first exports all of it to /tmp, and
        # a 15 GB CUDA image filled the runner's disk (eva-decision-model:1.0.2,
        # "no space left on device").
        # --list-all-pkgs: the report also lists every package, so the SBOM
        # below is converted from it instead of a second scan of the layers.
        # A scan failure is usually the network (the vulnerability DB download
        # or a registry read answering 504: eva-server dev builds 05-11-2026),
        # so it gets two more tries before it counts. Findings do not set rc.
        for attempt in 1 2 3; do
          rc=0
          trivy image --image-src remote --quiet --timeout 30m --ignore-unfixed --severity HIGH,CRITICAL \
            --list-all-pkgs --format json --output "$report" "$REF" || rc=$?
          if [ "$rc" -eq 0 ] && [ -s "$report" ]; then break; fi
          if [ "$attempt" -lt 3 ]; then
            echo "::warning::trivy attempt ${attempt} failed (exit ${rc}); retrying"
            sleep $((attempt * 20))
          fi
        done
        if [ "$rc" -ne 0 ] || [ ! -s "$report" ]; then
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::trivy could not scan ${REF} (exit ${rc}): a scan failure, not a finding"
            exit 1
          fi
          echo "::warning::trivy could not scan ${REF} (exit ${rc}): a scan failure, not a finding; not enforced yet (enforce: false)"
          exit 0
        fi
        # Report everything HIGH and up in the job summary...
        trivy convert --format table "$report" > "${RUNNER_TEMP}/trivy.txt" || true
        {
          echo "### Trivy: ${REF}"
          echo '```'
          cat "${RUNNER_TEMP}/trivy.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        # ...and fail only on the severities that must not ship.
        blocking="$(python3 - "$report" "$FAIL_ON" <<'PY'
        import json, sys
        report, fail_on = sys.argv[1], {s.strip() for s in sys.argv[2].split(",") if s.strip()}
        data = json.load(open(report, encoding="utf-8"))
        found = sorted({f"{v['PkgName']} {v['VulnerabilityID']}"
                        for r in data.get("Results") or [] for v in r.get("Vulnerabilities") or []
                        if v.get("Severity") in fail_on})
        print("\n".join(found))
        PY
        )"
        if [ -n "$blocking" ]; then
          printf '%s\n' "$blocking"
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::${REF} has fixable ${FAIL_ON} vulnerabilities (see the job summary)"
            exit 1
          fi
          echo "::warning::${REF} has fixable ${FAIL_ON} vulnerabilities; not enforced yet (enforce: false)"
        fi

    # Signed by digest, without the public transparency log: the registry is
    # private, and a public log would list our repositories and digests.
    # Stored as a sha256-<digest>.sig TAG (the classic format, hidden flag
    # --new-bundle-format=false): cosign 3 otherwise writes a bundle as an
    # untagged OCI referrer, which eva-server's acr-retention purges after 2
    # days -- the image would lose its signature without a trace. The
    # self-test checks the tag exists.
    - id: sign
      if: inputs.cosign-key != ''
      shell: bash
      env:
        REF: ${{ steps.digest.outputs.ref }}
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-key }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
        GIT_SHA: ${{ github.sha }}
        GIT_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # Signing writes a tag to the registry; a 504 there failed the build on
        # 05-11-2026 (09:14). Signing the same digest again is idempotent.
        for attempt in 1 2 3; do
          if cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
              --use-signing-config=false --tlog-upload=false \
              --new-bundle-format=false \
              -a "repo=${GIT_REPO}" -a "commit=${GIT_SHA}" \
              "$REF"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then echo "::error::cosign sign failed 3 times"; exit 1; fi
          echo "::warning::cosign sign attempt ${attempt} failed; retrying"
          sleep $((attempt * 15))
        done
        echo "::notice::signed ${REF}"

    # The SBOM of this digest as an in-toto attestation, signed with the same
    # key (`sha256-<digest>.att` TAG next to the .sig, classic format for the
    # same reason). The agent-VM's advisory watch reads it to re-check running
    # images against every new advisory -- for images it cannot map to one
    # lockfile (sandbox, egress gateway, `latest` images). Converted from the
    # scan's report (no second scan). A failure here warns and does not fail
    # the build: the image is scanned and signed; only the re-check misses it.
    - id: attest
      if: inputs.cosign-key != ''
      shell: bash
      env:
        REF: ${{ steps.digest.outputs.ref }}
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-key }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
      run: |
        set -uo pipefail
        report="${RUNNER_TEMP}/trivy.json"
        sbom="${RUNNER_TEMP}/sbom.cdx.json"
        if [ ! -s "$report" ] || ! trivy convert --format cyclonedx --output "$sbom" "$report"; then
          echo "::warning::no SBOM for ${REF}: the scan report is missing or could not be converted"
          exit 0
        fi
        if cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type cyclonedx --predicate "$sbom" \
             --use-signing-config=false --tlog-upload=false --new-bundle-format=false "$REF"; then
          echo "::notice::SBOM attested for ${REF}"
        else
          echo "::warning::SBOM attestation failed for ${REF}; the image is signed, the daily re-check will miss it"
        fi
