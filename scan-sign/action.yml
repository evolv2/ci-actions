name: Scan and sign a pushed image
description: >-
  Resolve the digest of an image pushed to ACR, scan it with Trivy (fail on a
  CRITICAL vulnerability that has a fix), and sign it by digest with cosign.
  Run it right after the push, with docker logged in to the registry: via
  `az acr login` in the evolv2 platform repos (digest-source acr), or via
  `docker login` with a repository-scoped ACR token in evolv2-apps
  (digest-source registry). Trivy and cosign read docker's credentials.

inputs:
  image:
    description: Repository in the registry, e.g. evaplatform.azurecr.io/eva-server
    required: true
  tag:
    description: The pinned tag that was just pushed (not dev/latest)
    required: true
  registry:
    description: ACR name, used to resolve the digest (digest-source acr)
    default: evaplatform
  digest-source:
    description: >-
      How to resolve the pushed digest. "acr" (default): `az acr repository
      show`, needs `az login`, as the evolv2 platform repos do. "registry":
      ask the registry itself with `docker buildx imagetools inspect`, needs
      only `docker login` -- for evolv2-apps, whose builds log in with a
      repository-scoped ACR token and have no Azure identity. Both return the
      manifest digest the registry stores for the tag.
    default: acr
  cosign-key:
    description: cosign private key (secrets.COSIGN_PRIVATE_KEY). Empty = scan only.
    default: ""
  cosign-password:
    description: password of the cosign key (secrets.COSIGN_PASSWORD)
    default: ""
  fail-on:
    description: Trivy severities that fail the build when a fix exists
    default: CRITICAL
  enforce:
    description: >-
      "true" fails the build on fail-on findings; "false" only reports them
      (job summary + warning). Use "false" while a repo still has findings
      from before the gate existed, then switch to "true".
    default: "true"

outputs:
  digest:
    description: sha256 digest of the image
    value: ${{ steps.digest.outputs.digest }}
  ref:
    description: image@digest
    value: ${{ steps.digest.outputs.ref }}

runs:
  using: composite
  steps:
    # The digest ACR indexes, not the one buildx prints: the two differ for
    # buildx pushes, and pinning on the buildx one gave ImagePullBackOff
    # (eva-server build-backup-image.yml). Sign and scan exactly what runs.
    - id: digest
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        REGISTRY: ${{ inputs.registry }}
        DIGEST_SOURCE: ${{ inputs.digest-source }}
      run: |
        set -euo pipefail
        repo="${IMAGE#*/}"
        case "$DIGEST_SOURCE" in
          acr)
            digest=$(az acr repository show -n "$REGISTRY" --image "${repo}:${TAG}" --query digest -o tsv) ;;
          registry)
            # The descriptor the registry returns for the tag: for a buildx
            # push with attestations that is the index digest, exactly what
            # `az acr repository show` reports and what a pod pulls.
            digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r '.digest') ;;
          *)
            echo "::error::digest-source must be 'acr' or 'registry' (got '${DIGEST_SOURCE}')"
            exit 1 ;;
        esac
        if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::No digest for ${IMAGE}:${TAG} (got '${digest}')"
          exit 1
        fi
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        echo "ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
        echo "::notice::${IMAGE}:${TAG} = ${digest}"

    # Official releases, checksum-verified: the self-hosted runners have no
    # tools preinstalled, and an unverified download would be the weak link of
    # a supply-chain check.
    - id: tools
      shell: bash
      run: |
        set -euo pipefail
        bin="${RUNNER_TEMP}/scan-sign-bin"; mkdir -p "$bin"; cd "$bin"
        TRIVY=0.75.0
        curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY}/trivy_${TRIVY}_Linux-64bit.tar.gz"
        curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY}/trivy_${TRIVY}_checksums.txt"
        grep " trivy_${TRIVY}_Linux-64bit.tar.gz$" "trivy_${TRIVY}_checksums.txt" | sha256sum -c -
        tar -xzf "trivy_${TRIVY}_Linux-64bit.tar.gz" trivy
        COSIGN=3.1.3
        curl -fsSLO "https://github.com/sigstore/cosign/releases/download/v${COSIGN}/cosign-linux-amd64"
        curl -fsSLO "https://github.com/sigstore/cosign/releases/download/v${COSIGN}/cosign_checksums.txt"
        grep " cosign-linux-amd64$" cosign_checksums.txt | sha256sum -c -
        mv cosign-linux-amd64 cosign && chmod +x cosign trivy
        echo "$bin" >> "$GITHUB_PATH"

    - id: scan
      shell: bash
      env:
        REF: ${{ steps.digest.outputs.ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        ENFORCE: ${{ inputs.enforce }}
      run: |
        set -euo pipefail
        # Report everything HIGH and up in the job summary...
        trivy image --quiet --ignore-unfixed --severity HIGH,CRITICAL --format table "$REF" \
          > "${RUNNER_TEMP}/trivy.txt" || true
        {
          echo "### Trivy: ${REF}"
          echo '```'
          cat "${RUNNER_TEMP}/trivy.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        # ...and fail only on the severities that must not ship.
        if ! trivy image --quiet --ignore-unfixed --severity "$FAIL_ON" --exit-code 1 --format table "$REF"; then
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::${REF} has fixable ${FAIL_ON} vulnerabilities (see the job summary)"
            exit 1
          fi
          echo "::warning::${REF} has fixable ${FAIL_ON} vulnerabilities; not enforced yet (enforce: false)"
        fi

    # Signed by digest, without the public transparency log: the registry is
    # private, and a public log would list our repositories and digests.
    # Stored as a sha256-<digest>.sig TAG (the classic format, hidden flag
    # --new-bundle-format=false): cosign 3 otherwise writes a bundle as an
    # untagged OCI referrer, which eva-server's acr-retention purges after 2
    # days -- the image would lose its signature without a trace. The
    # self-test checks the tag exists.
    - id: sign
      if: inputs.cosign-key != ''
      shell: bash
      env:
        REF: ${{ steps.digest.outputs.ref }}
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-key }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
        GIT_SHA: ${{ github.sha }}
        GIT_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
          --use-signing-config=false --tlog-upload=false \
          --new-bundle-format=false \
          -a "repo=${GIT_REPO}" -a "commit=${GIT_SHA}" \
          "$REF"
        echo "::notice::signed ${REF}"
